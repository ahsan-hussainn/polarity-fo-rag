# The Stage 2 scheduler (ADR-0027). GitHub Actions is the platform-kept run history the brief
# requires: every scheduled cycle appears in the Actions tab with its own detail page and log,
# independent of anything we could edit after the fact.
#
# Cadence: every 6 hours at :23 (odd minute -- top-of-the-hour cron on shared runners is routinely
# delayed 15-60 min; :23 dodges the rush). Cron is UTC. The `concurrency` group guarantees a slow
# cycle can never overlap the next one (no duplicated work, no corrupted state -- arch note 4).
#
# workflow_dispatch exists for smoke tests only. Dispatch runs are triggered by a human and are
# NEVER counted toward the mandate's ">=2 scheduled runs executed without you triggering them";
# the cycle records its trigger (github.event_name) in ops.runs so the ledger tells them apart.
name: operate

on:
  schedule:
    - cron: "23 */6 * * *"
    # Jitter tolerance (ADR-0027 contingency, added 2026-07-27): the first-ever 12:23 UTC slot was
    # dropped by GitHub (documented behavior for new schedules under load). This daily line adds a
    # near-term occurrence and the push itself re-registers the schedule. Runs remain platform-
    # fired; this is a committed code change, not a manual trigger.
    - cron: "40 13 * * *"
    # Second jitter line (2026-07-27 19:10 PKT): 13:40 UTC also dropped -- two dropped slots on
    # day one of a brand-new workflow. GitHub's scheduler is known to warm up slowly on new
    # workflows; extra daily lines give it more delivery chances tonight and get pruned (with a
    # commit saying so) once the 6h heartbeat proves reliable.
    - cron: "53 14 * * *"
    # 2026-07-28: the 6h heartbeat HAS now proven reliable (5 consecutive scheduled runs, no
    # drops since run 3), so the promise above was to prune these two lines. They are kept
    # instead, for a different and stated reason: the discovery queue holds 311 candidates
    # against ~16 remaining 6h slots, and the extra daily slots are throughput the climb needs.
    # Recorded here rather than silently retained -- the original justification has expired.
  workflow_dispatch: {}

concurrency:
  group: operate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cycle:
    runs-on: ubuntu-latest
    # Raised from 45 with the tranche size (below). Measured: run 14 took 21 min at 15
    # candidates/cycle, and the LLM extraction calls dominate (~90s each, ~12 per run). At 40
    # candidates a cycle should land near 50-70 min; 180 leaves real headroom while staying far
    # under the 6h cadence, so a slow cycle still cannot overlap the next one.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply migrations (idempotent)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m pipeline.cli db-migrate

      - name: Run operating cycle
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MILLIONVERIFIER_API_KEY: ${{ secrets.MILLIONVERIFIER_API_KEY }}
          # Sized from measurement, not preference: 311 queued candidates against ~16 remaining
          # 6h slots means 15/cycle never drains the queue inside the window. 40 drains it in
          # ~8 cycles and leaves Thu/Fri for review. Cost is negligible (~$0.0009 per extraction).
          OPS_DISCOVER_PER_CYCLE: "40"
        shell: bash
        run: |
          set -o pipefail
          python -m pipeline.cli operate --write --trigger "${{ github.event_name }}" 2>&1 | tee cycle-output.txt

      - name: Upload raw cycle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cycle-${{ github.run_id }}
          path: cycle-output.txt
          if-no-files-found: warn
